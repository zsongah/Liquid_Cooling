[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-control"
version = "0.7.0"
description = "Configurable CDU supervisory control runtime with Modbus TCP and simulation validation"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["lc_control*"]

[tool.setuptools.package-data]
lc_control = ["web/*.html", "web/*.css", "web/*.js"]
